<div class="dashboard grid grid-cols-[1fr_2fr] grid-rows-2 gap-4 h-full overflow-hidden p-4 bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100">

    <!-- Top-left: metric cards -->
    <div class="grid grid-cols-2 gap-4 min-w-0 min-h-0">
        <div class="grid grid-rows-2 gap-4 min-w-0 min-h-0">
            <app-metric-card class="min-w-0" title="Total Accounts" [data]="totalAccounts()" icon="pi pi-user">
            </app-metric-card>

            <app-metric-card class="min-w-0" title="Total Securities" [data]="totalSecurities()" icon="pi pi-lock">
            </app-metric-card>
        </div>

        <div class="grid grid-rows-2 gap-4 min-w-0 min-h-0">
            <app-metric-card class="min-w-0" title="Total Holdings" [data]="totalHoldings()" icon="pi pi-briefcase">
            </app-metric-card>

            <app-metric-card class="min-w-0" title="Total Invested Cost" [data]="totalInvestedCost()" icon="pi pi-dollar" [isCurrency]="true">
            </app-metric-card>
        </div>
    </div>

    <!-- Top-right: portfolio value line chart -->
    <div class="min-w-0 min-h-0">
        <app-portfolio-value-chart [data]="portfolioValueHistory()"></app-portfolio-value-chart>
    </div>

    <!-- Bottom-left: breakdown pie chart carousel -->
    <div class="flex flex-col min-w-0 min-h-0">
        <app-breakdown-carousel class="flex-1 min-h-0" #carousel [titles]="breakdownTitles">
            @switch (carousel.activeIndex()) {
                @case (0) {
                    <app-security-type-chart [data]="securityTypeBreakdown()"></app-security-type-chart>
                }
                @case (1) {
                    <app-account-type-chart [data]="accountTypeBreakdown()"></app-account-type-chart>
                }
                @case (2) {
                    <app-security-sector-chart [data]="securitySectorBreakdown()"></app-security-sector-chart>
                }
            }
        </app-breakdown-carousel>
    </div>

    <!-- Bottom-right: recent accounts / top securities -->
    <div class="flex flex-row gap-4 min-w-0 min-h-0">
        <app-dashboard-table class="flex-1 min-w-0" title="Recent Accounts" [data]="recentAccounts()" [columns]="accountColumns" link="/account">
        </app-dashboard-table>

        <app-dashboard-table class="flex-1 min-w-0" title="Top Securities" [data]="topSecurities()" [columns]="securityColumns" link="/security">
        </app-dashboard-table>
    </div>

</div>
