<div class="dashboard grid grid-cols-[1fr_2fr] grid-rows-2 gap-4 min-h-full p-4 bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100">

    <!-- Top-left: metric cards -->
    <div class="grid grid-cols-[1fr_2fr] gap-4 min-w-0 min-h-0">
        <div class="grid grid-rows-2 gap-4 min-w-0 min-h-0">
            <app-metric-card class="min-w-0" title="Total Accounts" [data]="totalAccounts()" icon="pi pi-user">
            </app-metric-card>

            <app-metric-card class="min-w-0" title="Total Securities" [data]="totalSecurities()" icon="pi pi-lock">
            </app-metric-card>
        </div>

        <div class="grid grid-rows-2 gap-4 min-w-0 min-h-0">
            <app-metric-card class="min-w-0" title="Total Holdings" [data]="totalHoldings()" icon="pi pi-briefcase">
            </app-metric-card>

            <app-metric-card class="min-w-0" title="Total Invested Cost" [data]="totalInvestedCost()" icon="pi pi-dollar">
            </app-metric-card>
        </div>
    </div>

    <!-- Top-right: portfolio value line chart -->
    <div class="min-w-0 min-h-0">
        <app-portfolio-value-chart [data]="portfolioValueHistory()"></app-portfolio-value-chart>
    </div>

    <!-- Bottom-left: breakdown pie chart carousel -->
    <div class="min-w-0 min-h-0">
        @switch (activeBreakdownIndex()) {
            @case (0) {
                <app-security-type-chart [data]="securityTypeBreakdown()" (previous)="previousBreakdown()" (next)="nextBreakdown()"></app-security-type-chart>
            }
            @case (1) {
                <app-account-type-chart [data]="accountTypeBreakdown()" (previous)="previousBreakdown()" (next)="nextBreakdown()"></app-account-type-chart>
            }
            @case (2) {
                <app-security-sector-chart [data]="securitySectorBreakdown()" (previous)="previousBreakdown()" (next)="nextBreakdown()"></app-security-sector-chart>
            }
        }
    </div>

    <!-- Bottom-right: recent accounts / top securities -->
    <div class="flex flex-row gap-4 min-w-0 min-h-0">
        <app-dashboard-table class="flex-1 min-w-0 overflow-y-auto" title="Recent Accounts" [data]="recentAccounts()" [columns]="accountColumns" link="/account">
        </app-dashboard-table>

        <app-dashboard-table class="flex-1 min-w-0 overflow-y-auto" title="Top Securities" [data]="topSecurities()" [columns]="securityColumns" link="/security">
        </app-dashboard-table>
    </div>

</div>
