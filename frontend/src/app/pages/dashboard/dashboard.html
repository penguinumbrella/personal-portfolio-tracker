<div class="dashboard flex flex-col p-4 m-6">

    <h1 class="text-3xl font-bold mb-4">Overview</h1>
    
    <div class="flex flex-row gap-4 mb-8">
        <app-metric-card class="flex-1" title="Total Accounts" [data]="totalAccounts()" icon="pi pi-user">
        </app-metric-card>

        <app-metric-card class="flex-1" title="Total Securities" [data]="totalSecurities()" icon="pi pi-lock">
        </app-metric-card>

        <app-metric-card class="flex-1" title="Total Holdings" [data]="totalHoldings()" icon="pi pi-briefcase">
        </app-metric-card>

        <app-metric-card class="flex-1" title="Total Invested Cost" [data]="totalInvestedCost()" icon="pi pi-dollar">
        </app-metric-card>
    </div>

    <div class="flex flex-row gap-4">
        <app-dashboard-table title="Recent Accounts" [data]="recentAccounts()" [columns]="accountColumns">
        </app-dashboard-table>

        <app-dashboard-table title="Top Securities" [data]="topSecurities()" [columns]="securityColumns">
        </app-dashboard-table>
    </div>

</div>
