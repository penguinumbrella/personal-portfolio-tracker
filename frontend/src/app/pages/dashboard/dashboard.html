<div class="dashboard flex flex-col">


    <!-- 4 cards -->
    <div class="grid flex flex-row">

        <app-metric-card 
            title="Total Accounts" 
            [data]="totalAccounts()" 
            icon="pi pi-user">
        </app-metric-card>

        <app-metric-card 
            title="Total Securities" 
            [data]="totalSecurities()" 
            icon="pi pi-user">
        </app-metric-card>

        <app-metric-card 
            title="Total Holdings" 
            [data]="totalHoldings()" 
            icon="pi pi-user">
        </app-metric-card>

        <app-metric-card 
            title="Total Invested Cost" 
            [data]="totalInvestedCost()" 
            icon="pi pi-user">
        </app-metric-card>
        
    </div>

    <div class = "grid flex flex-col">
        <app-dashboard-table 
        title="Recent Accounts"
        [data]="recentAccounts()">
    </app-dashboard-table>
    </div>

    <!-- 2 tables -->
</div>
