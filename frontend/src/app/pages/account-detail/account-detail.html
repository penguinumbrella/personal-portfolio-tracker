<div class="page-layout">
    <div class="sidebar-col">
        <app-detail-sidebar [items]="sidebarItems()" (selected)="onAccountSelect($event)" />
    </div>

    <div class="table-col">
        <div class="metric-cards flex row justify-between m-3 gap-3">

            <app-metric-card title="Total Holdings" [data]="this.holdings().length" icon="pi pi-trophy"
                class="flex-1" />

            <app-metric-card title="Invested Cost" [data]="totalInvestedCost()" icon="pi pi-dollar" class="flex-1">
            </app-metric-card>
        </div>

        <app-detail-card title="Account Details" [fields]="accountFields()" (onEdit)="editAccount()"
            (onDelete)="deleteAccount()" />

        <app-holding-table [holdings]="holdings()" [tableMode]="'byAccount'" (onAdd)="addHolding()"
            (onEdit)="editHolding($event)" (onDelete)="deleteHolding($event)" />
    </div>

    <app-manage-holding-modal [(visible)]="isHoldingModalVisible" [form]="modalForm()"
        [editingHolding]="editingHolding()" [allSecurities]="allSecurities()" [recordName]="'Holding'"
        (confirmed)="onHoldingModalConfirm($event)" (cancelled)="isHoldingModalVisible.set(false)" />

</div>
