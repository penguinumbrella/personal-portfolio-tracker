<div class="page-layout">
    <div class="sidebar-col">
        <app-detail-sidebar 
        [items]="sidebarItems()" 
        (selected)="onSecuritySelect($event)"
        (onAddItem)="onOpenAddSecurityModal()" />
    </div>

    @if (security()) {
    <div class="table-col">
        <div class="metric-cards flex row justify-between m-3 gap-3">
            <app-metric-card title="Total Holdings" [data]="this.holdings().length" icon="pi pi-trophy"
                class="flex-1" />
            <app-metric-card title="Invested Cost" [data]="totalInvestedCost()" icon="pi pi-dollar" class="flex-1" />
        </div>

        <app-detail-card title="Security Details" [fields]="securityFields()" (onEdit)="editSecurity()"
            (onDelete)="confirmDeleteSecurity()" />

        <app-holding-table [holdings]="holdings()" [tableMode]="'bySecurity'" (onAdd)="addHolding()"
            (onEdit)="editHolding($event)" (onDelete)="confirmDeleteHolding($event.holding, $event.originalEvent)" />
    </div>
    } @else {
    <div class="table-col flex justify-center items-center">
        <p>Please select a security to view details.</p>
    </div>
    }

    <app-manage-holding-modal 
        [viewMode]="'bySecurity'"
        [(visible)]="isHoldingModalVisible" 
        [form]="modalForm()"
        [editingHolding]="editingHolding()"
        [filteredAccounts]="filteredAccounts()"
        [recordName]="'Holding'"
        (confirmed)="onHoldingModalConfirm($event)"
        (cancelled)="isHoldingModalVisible.set(false)"
    />

    <app-manage-security-modal 
    
        [(visible)]="isSecurityModalVisible"
        [form]="securityForm()"
        [editingSecurity]="editingSecurity()"
        (confirmed)="onSecurityModalConfirm($event)" />

        <p-confirmDialog></p-confirmDialog>
</div>
