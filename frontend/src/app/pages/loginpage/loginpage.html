<div class="min-h-screen w-full flex">
    <div class="w-1/2 flex items-center justify-center bg-gray-50 dark:bg-zinc-900 p-8">
        <div class="w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-zinc-100">Your portfolio made simple</h1>
                <p class="text-sm text-gray-500 dark:text-zinc-400 mt-1">Please log in or sign up to continue.</p>
            </div>

            <p-card styleClass="shadow-sm">
                @if (loginMode()) {
                <app-login-form (switchToSignup)="loginMode.set(false)" />
                } @else {
                <app-signup-form (switchToLogin)="loginMode.set(true)" />
                }
            </p-card>
        </div>
    </div>

    <div class="w-1/2 hidden md:block">
        <img src="image.png" 
             alt="Portfolio illustration" 
             class="h-full w-full object-cover">
    </div>
</div>
