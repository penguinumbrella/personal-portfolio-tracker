<div class="card h-full p-4 bg-white dark:bg-gray-900 border-r border-gray-300 dark:border-gray-700">
  
  <div class="text-2xl font-bold px-2 mb-6 text-gray-900 dark:text-gray-100">
    PFolio
  </div>

  <p-menu [model]="items" styleClass="w-full border-none bg-transparent">
    <ng-template #item let-item>
      <a [routerLink]="item.routerLink" 
         routerLinkActive="!border-blue-500 text-blue-500"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex align-items-center py-3 px-3 mb-2 border-2 border-transparent transition-all duration-200 hover:border-gray-400 dark:hover:border-gray-500 rounded-lg">
        <span [class]="item.icon"></span>
        <span class="ml-2 font-medium">{{ item.label }}</span>
      </a>
    </ng-template>
  </p-menu>
</div>
