<p-card styleClass="border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-zinc-800">
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2 text-zinc-800 dark:text-zinc-100 font-semibold">
      <i class="pi pi-chart-line text-yellow-500"></i>
      <span>{{ title() }}</span>
    </div>
    
    <div class="flex p-1 bg-gray-100 dark:bg-zinc-900 rounded-full w-fit">
      @for (opt of rangeOptions; track opt.key) {
        <button 
          type="button" 
          (click)="setRange(opt.key)"
          class="px-5 py-1.5 text-sm font-medium rounded-full transition-all duration-200"
          [class.bg-white]="activeRange() === opt.key"
          [class.dark:bg-zinc-700]="activeRange() === opt.key"
          [class.shadow-sm]="activeRange() === opt.key"
          [class.text-yellow-600]="activeRange() === opt.key"
          [class.dark:text-yellow-400]="activeRange() === opt.key"
          [class.text-zinc-500]="activeRange() !== opt.key"
          [class.hover:text-zinc-700]="activeRange() !== opt.key">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  @if (chartData().labels.length > 0) {
    <p-chart type="line" [data]="chartData()" [options]="chartOptions()" [style]="{ width: '100%', height: '300px' }" />
  } @else {
    <p class="text-sm text-500 dark:text-gray-400 text-center py-8">No holdings to display.</p>
  }
</p-card>
