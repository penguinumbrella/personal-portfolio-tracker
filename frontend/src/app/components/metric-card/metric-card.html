<p-card class="flex-1 flex flex-col grow shadow-sm">
  <div class="flex items-center justify-center">
    <i [class]="icon + ' text-primary text-xl mr-2'"></i>
    <span class="text-2xl font-bold text-900">{{ data() }}</span>
  </div>
  <span class="text-sm text-500 flex justify-center">{{ title }}</span>
</p-card>
