<p-card class="shadow-sm border border-gray-200 dark:border-gray-700 rounded-lg">
  <div class="flex flex-col items-start gap-3">
    <div class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-zinc-700">
      <i [class]="icon + ' text-primary text-xl'"></i>
    </div>
    <span class="text-2xl font-bold text-900 dark:text-gray-100">{{ isCurrency ? (data() | currency) : data() }}</span>
    <span class="text-sm text-500 dark:text-gray-400">{{ title }}</span>
  </div>
</p-card>
