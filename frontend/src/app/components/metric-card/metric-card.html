<p-card class="flex-1">
  <div class="flex align-items-center gap-3">
    <div class="flex align-items-center justify-content-center bg-primary-100 border-round p-3">
      <i [class]="icon + ' text-primary text-xl'"></i>
    </div>
    
    <div class="flex flex-column">
      <span class="text-2xl font-bold text-900">{{ data() }}</span>
      <span class="text-sm text-500">{{ title }}</span>
    </div>
  </div>
</p-card>
