<p-card class="flex-1 flex flex-col grow shadow-sm border border-gray-200 dark:border-gray-700 rounded-lg">
  <div class="flex items-center justify-center">
    <i [class]="icon + ' text-primary text-xl mr-2'"></i>
    <span class="text-2xl font-bold text-900 dark:text-gray-100">{{ data() }}</span>
  </div>
  <span class="text-sm text-500 dark:text-gray-400 flex justify-center">{{ title }}</span>
</p-card>
