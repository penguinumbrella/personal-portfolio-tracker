<form [formGroup]="form" (ngSubmit)="login()" class="flex flex-col gap-5">
  <div class="flex flex-col gap-1">
    <label for="username" class="text-sm font-medium text-gray-700">Username</label>
    <input pInputText id="username" formControlName="username" class="w-full" />
    @if (form.controls.username.invalid && form.controls.username.touched) {
    <span class="text-xs text-red-600">Username is required.</span>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="password" class="text-sm font-medium text-gray-700">Password</label>
    <p-password formControlName="password" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
    <span class="text-xs text-red-600">Password is required.</span>
    }
  </div>

  @if (errorMessage()) {
  <div class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2">
    {{ errorMessage() }}
  </div>
  }

  <p-button type="submit" label="Log In" severity="primary" [loading]="submitting()" [disabled]="form.invalid" styleClass="w-full" />
</form>

<div class="flex items-center gap-3 my-5">
  <div class="flex-1 h-px bg-gray-200"></div>
  <span class="text-xs text-gray-400">OR</span>
  <div class="flex-1 h-px bg-gray-200"></div>
</div>

<p-button label="Create an account" severity="secondary" [outlined]="true" styleClass="w-full" (onClick)="switchToSignup.emit()" />
