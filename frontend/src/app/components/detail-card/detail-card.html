<p-card class="shadow-sm border border-gray-200 dark:border-zinc-700">
    <ng-template pTemplate="header">
        <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-zinc-800">
            <span class="text-xl font-bold text-gray-900 dark:text-zinc-100">{{ title }}</span>
            <div class="flex gap-1">
                <p-button icon="pi pi-pencil" [text]="true" severity="secondary"
                    (onClick)="onEdit.emit()" />
                <p-button icon="pi pi-trash" [text]="true" severity="danger"
                    (onClick)="onDelete.emit()" />
            </div>
        </div>
    </ng-template>

    <div class="grid grid-cols-2 gap-x-6 gap-y-3">
        @for (field of fields(); track field.label) {
        <div class="flex flex-col gap-1">
            <span class="text-xs text-gray-500 dark:text-zinc-400">{{ field.label }}</span>
            <span class="text-base font-semibold text-gray-900 dark:text-zinc-100">{{ field.value }}</span>
        </div>
        }
    </div>
</p-card>
