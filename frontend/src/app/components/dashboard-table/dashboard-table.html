<p-card [header]="title">
  <p-table [value]="data">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.name }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
