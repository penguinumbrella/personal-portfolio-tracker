<p-card [header]="title">
  <p-table [value]="data()">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th>Amount</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.nickname }}</td>
        <td>{{ row.dateOpened }}</td>
        <td>{{ row.totalAmount }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
