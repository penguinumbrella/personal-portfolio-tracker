@if (currentUser(); as user) {

<div class="flex align-items-center gap-3 cursor-pointer" (click)="openModal()">
    <p-avatar 
        image="path/to/profile.jpg" 
        size="normal" 
        shape="circle">
    </p-avatar>

    <div class="flex flex-col">
        <span class="font-bold text-900">{{user.username}}</span>
        <span class="text-sm text-500">@{{user.username}}</span>
    </div>

    <app-user-modal
        [(visible)]="isModalVisible"
        [recordName]="user.username"
        (confirmed)="saveUser($event)"
        (cancelled)="closeModal()"
        (loggedOut)="logout()"
        [form]="form"
        >

    </app-user-modal>
</div>
} @else {
    <p>Loading user profile...</p>
}
