<div class="w-full h-full flex flex-col">
    <div class="p-2 flex items-center gap-2">
        <button pButton
            icon="pi pi-plus"
            [label]="addLabel()"
            class="p-button-sm !rounded-full" 
            (click)="onAddClick()">
    </button>
        
        <p-iconField iconPosition="left" class="flex-1">
            <p-inputIcon>
                <i class="pi pi-search"></i>
            </p-inputIcon>
            <input pInputText type="text" (input)="onSearchInput($any($event.target).value)"
                placeholder="Search..." class="w-full !rounded-full !pl-10" />
        </p-iconField>
    </div>
    
    <p-scrollPanel class="flex-1">
        <div class="flex flex-col gap-1">
        @for (item of items(); track item.id) {
        <div class="rounded-lg cursor-pointer transition-colors hover:bg-gray-100 dark:hover:bg-zinc-800"
            [ngClass]="{ 'bg-gray-900 dark:bg-zinc-700': selectedId() === item.id }"
            (click)="onSelect(item)">
            <app-sidebar-card [title]="item.label" [data]="item.subtitle" [selected]="selectedId() === item.id" />
        </div>
        } @empty {
        <p class="text-sm text-gray-400 dark:text-zinc-500 text-center p-4">No items found.</p>
        }
        </div>
    </p-scrollPanel>
    
    @if (totalPages() > 1) {
    <div class="flex items-center justify-between p-2 text-sm text-gray-500 dark:text-zinc-400">
        <button pButton icon="pi pi-chevron-left" class="p-button-text p-button-sm" [disabled]="page() === 0"
            (click)="onPrevPage()"></button>
        <span>Page {{ page() + 1 }} of {{ totalPages() }}</span>
        <button pButton icon="pi pi-chevron-right" class="p-button-text p-button-sm"
            [disabled]="page() >= totalPages() - 1" (click)="onNextPage()"></button>
    </div>
    }
</div>
