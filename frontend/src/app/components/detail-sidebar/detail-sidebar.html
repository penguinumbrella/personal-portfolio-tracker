<!--https://v17.primeng.org/scrollpanel-->

<div class="card">
    <p-scrollPanel>
        @for (item of items(); track item.id) {
        <div class="sidebar-item" [class.selected]="selectedId() === item.id" (click)="onSelect(item)">
            <app-sidebar-card [title]="item.label" [data]="item.subtitle" />
        </div>
        }
        @empty {
        <p class="empty-message">No items found.</p>
        }
    </p-scrollPanel>
</div>
