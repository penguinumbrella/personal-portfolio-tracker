spring:
    application:
        name: project2_personal_portfolio_tracker
    output:
        ansi:
            enabled: always
    # DataSource bean auto enjected by elastic beanstalk
    datasource:
        url: jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
        username: ${RDS_USERNAME}
        password: ${RDS_PASSWORD}
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update

server:
    # Elastic Beanstalk's Java SE platform proxies nginx to 127.0.0.1:5000, not the app's
    # local-dev port - binding to 8080 here means nginx can never reach the app.
    port: 5000
