spring:
  application:
    name: project2_personal_portfolio_tracker
  output:
    ansi:
      enabled: always
  # DataSource bean
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # none, schema should be left alone
  jpa:
    hibernate:
      ddl-auto: none
  # get properties hidden in the env file
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080
  servlet:
    session:
      cookie:
        # frontend (localhost:4200) and backend (localhost:8080) are different origins, so the
        # session cookie needs SameSite=None to be sent back on cross-origin requests after login
        # (same issue as the CSRF cookie - see SecurityConfig's csrfTokenRepository())
        same-site: none
        secure: true
