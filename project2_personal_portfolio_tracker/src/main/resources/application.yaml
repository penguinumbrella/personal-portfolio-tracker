spring:
  application:
    name: project2_personal_portfolio_tracker
  output:
    ansi:
      enabled: always
  # DataSource bean
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # none, schema should be left alone
  jpa:
    hibernate:
      ddl-auto: none
  # get properties hidden in the env file
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080
