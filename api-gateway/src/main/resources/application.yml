spring:
    application:
        name: api-gateway
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: none
    config:
        import: optional:file:.env[.properties],optional:file:../.env[.properties]
    rabbitmq:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_PORT:5672}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: portfolio-investments
                          uri: lb://portfolio-service
                          predicates:
                            - Path=/v1/investments/**
                          filters:
                            - name: CircuitBreaker
                              args:
                                  id: portfolioCircuitBreaker
                                  fallbackUri: forward:/fallback/portfolio
                            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST

                        - id: portfolio-securities
                          uri: lb://portfolio-service
                          predicates:
                            - Path=/v1/securities/**
                          filters:
                            - name: CircuitBreaker
                              args:
                                  id: portfolioCircuitBreaker
                                  fallbackUri: forward:/fallback/portfolio
                            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST

                        - id: portfolio-holdings
                          uri: lb://portfolio-service
                          predicates:
                            - Path=/v1/holdings/**
                          filters:
                            - name: CircuitBreaker
                              args:
                                  id: portfolioCircuitBreaker
                                  fallbackUri: forward:/fallback/portfolio
                            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Expose-Headers, RETAIN_FIRST

                    globalcors:
                        cors-configurations:
                            '[/**]':
                                allowedOrigins:
                                    - "http://localhost:4200"
                                    - "http://127.0.0.1:5500"
                                    - "https://d13to6rck5cj2.cloudfront.net"
                                    - "https://d1jcki4jtvzqdz.cloudfront.net"
                                allowedMethods:
                                    - GET
                                    - POST
                                    - PUT
                                    - DELETE
                                    - OPTIONS
                                allowedHeaders: "*"
                                allowCredentials: true

# Open quickly when portfolio-service is down so demos don't need dozens of failed calls.
resilience4j:
    circuitbreaker:
        configs:
            default:
                slidingWindowSize: 5
                minimumNumberOfCalls: 3
                failureRateThreshold: 50
                waitDurationInOpenState: 10s
                permittedNumberOfCallsInHalfOpenState: 2
        instances:
            portfolioCircuitBreaker:
                baseConfig: default

server:
    port: 8125
    servlet:
        session:
            cookie:
                same-site: none
                secure: true

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            default-zone: http://localhost:8761/eureka/
        registry-fetch-interval-seconds: 5
    instance:
        hostname: localhost
        ip-address: 127.0.0.1
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}
        leaseRenewalIntervalInSeconds: 10
